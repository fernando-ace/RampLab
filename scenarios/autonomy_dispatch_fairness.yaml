    - {id: high_02, type: tug_cart_movement, required_capability: tug_cart_movement, origin: Service Depot, destination: Service Depot, release_time_s: 2.0, priority: 2, service_duration_s: 4.0}
    - {id: high_04, type: tug_cart_movement, required_capability: tug_cart_movement, origin: Service Depot, destination: Service Depot, release_time_s: 4.0, priority: 2, service_duration_s: 4.0}
    - {id: high_06, type: tug_cart_movement, required_capability: tug_cart_movement, origin: Service Depot, destination: Service Depot, release_time_s: 6.0, priority: 2, service_duration_s: 4.0}
    - {id: high_08, type: tug_cart_movement, required_capability: tug_cart_movement, origin: Service Depot, destination: Service Depot, release_time_s: 8.0, priority: 2, service_duration_s: 4.0}
    - {id: high_10, type: tug_cart_movement, required_capability: tug_cart_movement, origin: Service Depot, destination: Service Depot, release_time_s: 10.0, priority: 2, service_duration_s: 4.0}
