name: autonomy_dispatch_fairness
default_seed: 42
vehicle_scenario: autonomy_tug.yaml
dispatch:
  aging_interval_s: 5.0
  vehicles:
    - id: tug_fair_01
      start_node: Service Depot
      capabilities: [tug_cart_movement]
