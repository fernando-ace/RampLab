name: turnaround_disrupted
default_seed: 42
airport:
  nodes:
    - { id: depot, name: Service Depot, x_m: 0.0, y_m: 0.0 }
    - { id: gate_a1, name: Gate A1, x_m: 100.0, y_m: 0.0 }
    - { id: baggage_depot, name: Baggage Depot, x_m: 0.0, y_m: 8.0 }
    - { id: baggage_backup_depot, name: Baggage Backup Depot, x_m: 0.0, y_m: 16.0 }
    - { id: baggage_stand_a1, name: Gate A1 Baggage Stand, x_m: 100.0, y_m: 8.0 }
  edges:
    - { id: depot_a1, from: depot, to: gate_a1, distance_m: 100.0, traversal_time_seconds: 60 }
    - { id: gate_a1_depot, from: gate_a1, to: depot, distance_m: 100.0, traversal_time_seconds: 60 }
    - { id: baggage_depot_a1, from: baggage_depot, to: baggage_stand_a1, distance_m: 100.0, traversal_time_seconds: 60 }
    - { id: baggage_backup_a1, from: baggage_backup_depot, to: baggage_stand_a1, distance_m: 101.0, traversal_time_seconds: 60 }
    - { id: baggage_stand_gate_a1, from: baggage_stand_a1, to: gate_a1, distance_m: 8.0, traversal_time_seconds: 5 }
gates:
  - { id: A1, node: gate_a1 }
fleet:
  vehicles:
    - { id: fuel_1, name: FuelTruck-1, type: fueling, depot_node: depot, speed_mps: 10.0 }
    - { id: baggage_1, name: BaggageCart-1, type: baggage, depot_node: baggage_depot, speed_mps: 8.0 }
    - { id: baggage_backup, name: BaggageCart-Backup, type: baggage, depot_node: baggage_backup_depot, speed_mps: 8.0 }
aircraft:
  - id: AX101
    turnaround_id: TO-AX101
    gate: A1
    scheduled_arrival_seconds: 0
    scheduled_departure_seconds: 1500
    target_off_block_seconds: 1200
    service_tasks:
      - { id: deboard, type: deboarding, duration_seconds: 120 }
      - { id: fuel, type: fueling, duration_seconds: 300 }
      - { id: catering, type: catering, duration_seconds: 180 }
      - id: baggage_unload
        type: baggage
        duration_seconds: 240
        prerequisites: [deboard]
      - id: clean
        type: cabin_cleaning
        duration_seconds: 180
        prerequisites: [deboard]
      - id: baggage_load
        type: baggage_load
        duration_seconds: 240
        prerequisites: [baggage_unload, clean]
      - id: pushback
        type: pushback_preparation
        duration_seconds: 120
        prerequisites: [fuel, catering, baggage_load]
turnaround_disruptions:
  - { time_seconds: 200, aircraft: AX101, task: baggage_load, duration_seconds: 480 }
vehicle_outages:
  - { time_seconds: 130, vehicle: baggage_1 }
service_durations_seconds:
  fueling: 300
  baggage: 240
  deboarding: 120
  catering: 180
  cabin_cleaning: 180
  baggage_load: 240
  pushback_preparation: 120
