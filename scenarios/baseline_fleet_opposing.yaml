name: baseline_fleet_opposing
default_seed: 42

airport:
  nodes:
    - { id: west_hold, name: West Holding Bay, x_m: -20.0, y_m: -10.0 }
    - { id: north, name: North Junction, x_m: 0.0, y_m: 0.0 }
    - { id: south, name: South Junction, x_m: 120.0, y_m: 0.0 }
    - { id: east_hold, name: East Holding Bay, x_m: 140.0, y_m: 10.0 }
    - { id: west_exit, name: West Exit, x_m: -20.0, y_m: 10.0 }
    - { id: east_exit, name: East Exit, x_m: 140.0, y_m: -10.0 }
    - { id: cargo, name: Cargo Staging, x_m: 300.0, y_m: 0.0 }
    - { id: maintenance, name: Maintenance, x_m: 340.0, y_m: 0.0 }
  edges:
    - { id: west_approach, from: west_hold, to: north, distance_m: 22.4, traversal_time_seconds: 15 }
    - { id: north_south_narrow, from: north, to: south, distance_m: 120.0, traversal_time_seconds: 60 }
    - { id: south_exit, from: south, to: east_exit, distance_m: 22.4, traversal_time_seconds: 15 }
    - { id: east_approach, from: east_hold, to: south, distance_m: 22.4, traversal_time_seconds: 15 }
    - { id: north_exit, from: north, to: west_exit, distance_m: 20.0, traversal_time_seconds: 15 }
    - { id: east_exit_cargo, from: east_exit, to: cargo, distance_m: 160.3, traversal_time_seconds: 80 }
    - { id: cargo_maintenance, from: cargo, to: maintenance, distance_m: 40.0, traversal_time_seconds: 20 }

gates:
  - { id: A1, node: west_exit }
  - { id: A2, node: east_exit }
  - { id: A3, node: maintenance }

fleet:
  vehicles:
    - { id: fuel_1, name: FuelTruck-1, type: fueling, depot_node: cargo, speed_mps: 10.0 }
    - { id: baggage_1, name: BaggageCart-1, type: baggage, depot_node: cargo, speed_mps: 8.0 }

aircraft:
  - id: AX101
    gate: A1
    scheduled_arrival_seconds: 0
    scheduled_departure_seconds: 1500
    required_services: [fueling, baggage]

service_durations_seconds:
  fueling: 480
  baggage: 600
